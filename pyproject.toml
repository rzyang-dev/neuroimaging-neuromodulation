[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroimaging-neuromodulation"
version = "0.20.0"
description = "Python-native tools for TMS target selection and white-matter fMRI analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Neuroimaging and Neuromodulation contributors"}]
keywords = ["fMRI", "neuroimaging", "TMS", "resting-state", "NIfTI"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "nibabel>=5.0",
]

[project.optional-dependencies]
core = []
dicom = [
    "pydicom>=2.3",
    "dicom2nifti>=2.6",
]
diffusion = [
    "dipy>=1.10",
]
demo = [
    "nilearn>=0.10",
]
all = [
    "nilearn>=0.10",
    "dipy>=1.10",
    "dicom2nifti>=2.6",
    "pydicom>=2.3",
]
test = [
    "pytest>=8",
    "nilearn>=0.10",
    "dipy>=1.10",
    "dicom2nifti>=2.6",
    "pydicom>=2.3",
]
dev = [
    "build>=1.0",
    "wheel>=0.41",
    "pytest>=8",
]

[project.scripts]
nm-toolbox = "neuroimaging_neuromodulation.cli.main:main"
nm-tms = "neuroimaging_neuromodulation.cli.tms:main"
nm-wm = "neuroimaging_neuromodulation.cli.wm:main"
nm-preprocess = "neuroimaging_neuromodulation.cli.preprocess:main"
nm-diffusion = "neuroimaging_neuromodulation.cli.diffusion:main"
nm-dicom = "neuroimaging_neuromodulation.cli.dicom:main"
nm-pipeline = "neuroimaging_neuromodulation.cli.pipeline:main"
nm-app = "neuroimaging_neuromodulation.gui.enduser:main"
nm-gui = "neuroimaging_neuromodulation.gui.app:launch_gui"

[tool.setuptools]
packages = [
    "neuroimaging_neuromodulation",
    "neuroimaging_neuromodulation.io",
    "neuroimaging_neuromodulation.stats",
    "neuroimaging_neuromodulation.targets",
    "neuroimaging_neuromodulation.wm",
    "neuroimaging_neuromodulation.preprocess",
    "neuroimaging_neuromodulation.cli",
    "neuroimaging_neuromodulation.gui",
    "neuroimaging_neuromodulation.reporting",
    "neuroimaging_neuromodulation.diffusion",
    "neuroimaging_neuromodulation.segmentation",
    "neuroimaging_neuromodulation.deformations",
    "neuroimaging_neuromodulation.pipeline",
    "neuroimaging_neuromodulation.validation",
    "neuroimaging_neuromodulation.runtime",
]

[tool.setuptools.package-data]
neuroimaging_neuromodulation = [
    "data/*.nii",
    "data/*.nii.gz",
    "data/*.txt",
    "data/*.csv",
    "data/*.tsv",
    "data/MNI_JHU_tracts_ROIs/*.nii.gz",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
