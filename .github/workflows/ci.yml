name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  minimal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install minimal core
        run: python -m pip install -e .
      - name: Verify no optional runtime is required
        run: python -m neuroimaging_neuromodulation.cli.main doctor --json
      - name: Run release gates
        run: python scripts/check_release_gates.py
      - name: Run minimal-core tests
        run: python -m pytest tests/test_io.py tests/test_motion.py tests/test_coregister.py tests/test_runtime_diagnostics.py tests/test_packaging.py tests/test_dti_internal.py tests/test_tractography_internal.py tests/test_deformation_internal.py -q

  test:
    strategy:
      max-parallel: 3
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[test,diffusion,dicom,demo]"
      - name: Test
        run: python -m pytest
