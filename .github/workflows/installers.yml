name: Installers

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install '.[all]' pyinstaller
      - name: Build executables
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed \
            --name nm-app \
            --collect-all neuroimaging_neuromodulation \
            --paths . \
            packaging/launch_nm_app.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed \
            --name nm-gui \
            --collect-all neuroimaging_neuromodulation \
            --paths . \
            packaging/launch_nm_gui.py
          python -m PyInstaller --noconfirm --clean --onefile \
            --name nm-toolbox \
            --collect-all neuroimaging_neuromodulation \
            --paths . \
            packaging/launch_nm_toolbox.py
      - name: Smoke test packaged CLI
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then EXE=dist/nm-toolbox.exe; else EXE=dist/nm-toolbox; fi
          "$EXE" doctor --json
      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: nm-${{ matrix.os }}
          path: |
            dist/nm-app*
            dist/nm-gui*
            dist/nm-toolbox*
